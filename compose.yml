# DISCLAIMER: This projects has HARDCODED credentials. This should NEVER be like this in a production environment. It's only like this because it's a LAB, to speed things up.

services:
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - postgres

  backend:
    build: ./backend
    restart: on-failure
    environment:
      - DB_HOST=postgres
      - DB_USER=sqli_app
      - DB_PASSWORD=sqli_app_pass
      - DB_GOAT_USER=sqli_goat
      - DB_GOAT_PASSWORD=sqli_goat_pass
      - DB_LEVEL2_USER=sqli_level2
      - DB_LEVEL2_PASSWORD=level2pass
      - DB_LEVEL3_USER=sqli_level3
      - DB_LEVEL3_PASSWORD=level3pass
      - DB_LEVEL3_RCE_USER=sqli_level3_rce
      - DB_LEVEL3_RCE_PASSWORD=level3rcepass
      - DB_NAME=postgres
      - JWT_SECRET=jumentos-lab-secret
    ports:
      - 8000:5000
    volumes:
      - ./backend:/app 
    depends_on:
      - postgres
    networks:
      - postgres

  web:
    build: ./frontend
    restart: on-failure
    environment:
      - API_TARGET=http://backend:5000
    ports:
      - 80:5173
    volumes:
      - ./frontend:/project
      - /project/node_modules
    depends_on:
      - backend
    networks:
      - postgres

networks:
  postgres:

volumes:
  postgres_data:
